name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Live tests are deselected by addopts in pyproject.toml; -m is repeated
      # here deliberately so CI stays safe even if that default is ever changed.
      # The previous --ignore=tests/test_live.py did NOT cover the live tests in
      # test_live_mode.py (real set_mode writes) or test_integration.py; those
      # only skipped because CI has no credentials.
      - name: Run tests (excluding live)
        run: |
          python -m pytest tests/ -v --tb=short -m "not live" \
            | tee tests/results/ci_run_${{ matrix.python-version }}.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: tests/results/
          retention-days: 30
