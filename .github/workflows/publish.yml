name: Publish to PyPI

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # Triggers on tags like v0.3.0, v1.0.0
  workflow_dispatch:               # Allow manual trigger from Actions tab

permissions:
  contents: read
  id-token: write   # Required for Trusted Publisher (OIDC)

jobs:
  # CI-TAG-BRANCH-GUARD: Reject releases pushed from feature branches.
  # Prevents rogue agents from tagging a non-main commit and triggering a PyPI publish.
  verify-branch:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history required for merge-base check

      - name: Assert tag commit is reachable from origin/main
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF")
          echo "Tag commit: $TAG_COMMIT"
          echo "Checking reachability from origin/main..."
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to $TAG_COMMIT which is NOT reachable from origin/main."
            echo "::error::Only tags on commits in the main branch lineage may trigger a PyPI release."
            echo "::error::If this release is intentional, merge the branch to main first, then re-tag."
            exit 1
          fi
          echo "✅ Tag commit is on main — branch guard passed."

  # CI-VERSION-CONSISTENCY: Reject releases where pyproject.toml, __init__.py,
  # and the git tag name do not all agree on the version string.
  verify-versions:
    name: Verify version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert pyproject.toml, __init__.py, and tag all match
        run: |
          TAG="${GITHUB_REF_NAME}"                                  # e.g. v0.4.8
          EXPECTED="${TAG#v}"                                        # strip leading 'v' → 0.4.8

          # Extract from pyproject.toml
          PYPROJECT=$(python3 -c "
          import re, sys
          content = open('pyproject.toml').read()
          m = re.search(r'^version\s*=\s*\"([^\"]+)\"', content, re.MULTILINE)
          print(m.group(1) if m else 'NOT_FOUND')
          ")

          # Extract from __init__.py
          INITPY=$(python3 -c "
          import re, sys
          content = open('franklinwh_cloud/__init__.py').read()
          m = re.search(r'^__version__\s*=\s*[\"\']([\d.]+)[\"\']', content, re.MULTILINE)
          print(m.group(1) if m else 'NOT_FOUND')
          ")

          echo "Git tag version : $EXPECTED"
          echo "pyproject.toml  : $PYPROJECT"
          echo "__init__.py     : $INITPY"

          FAIL=0
          if [ "$PYPROJECT" != "$EXPECTED" ]; then
            echo "::error::pyproject.toml version ($PYPROJECT) does not match tag ($EXPECTED)"
            FAIL=1
          fi
          if [ "$INITPY" != "$EXPECTED" ]; then
            echo "::error::__init__.py __version__ ($INITPY) does not match tag ($EXPECTED)"
            FAIL=1
          fi
          if [ "$PYPROJECT" != "$INITPY" ]; then
            echo "::error::pyproject.toml ($PYPROJECT) and __init__.py ($INITPY) are inconsistent with each other"
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Version consistency check failed. Ensure pyproject.toml, __init__.py, and the git tag all carry the same version before releasing."
            exit 1
          fi
          echo "✅ All three version sources agree on $EXPECTED — consistency check passed."

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [verify-branch, verify-versions]   # Both guards must pass before building
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build                 # Only depends on build — not TestPyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/franklinwh-cloud
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
