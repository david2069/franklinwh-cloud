[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "franklinwh-cloud"
version = "0.4.9"
description = "Unofficial Python client library and CLI for FranklinWH energy storage systems via the Cloud API"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "david2069"},
]
keywords = [
    "franklinwh", "battery", "solar", "energy-storage",
    "home-energy-management", "agate", "apower", "tou",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx[http2]",
    "jsonschema",
]

[project.urls]
Homepage = "https://david2069.github.io/franklinwh-cloud/"
Documentation = "https://david2069.github.io/franklinwh-cloud/"
Source = "https://github.com/david2069/franklinwh-cloud"
"Bug Tracker" = "https://github.com/david2069/franklinwh-cloud/issues"
Changelog = "https://github.com/david2069/franklinwh-cloud/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
]
emulator = [
    "fastapi[standard]>=0.110.0",
    "uvicorn",
]

[project.scripts]
franklinwh-cli = "franklinwh_cloud.cli:main"

[tool.setuptools.packages.find]
include = ["franklinwh_cloud*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Live tests are OPT-IN. They authenticate against the production FranklinWH
# cloud, consume the 5000/day sendMqtt budget, and — in the case of
# tests/test_live_mode.py::test_live_set_mode — issue real set_mode() writes
# that change the operating mode of the physical aGate.
#
# Previously the `live` marker was declared but never deselected, so a plain
# `pytest tests/` mutated production hardware. Command-line `-m` overrides this
# default, so `pytest -m live` still runs them deliberately.
#
# See .agents/policies/live_test_protocol.md (AP-13).
addopts = "-m 'not live'"

markers = [
    "live: hits the real cloud API and aGate. Opt-in — deselected by default via addopts; run with `pytest -m live`.",
]
